name: One-shot live signal history patch

on:
  push:
    branches:
      - feat/live-signal-history

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[live-history-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-signal-history
          fetch-depth: 0
      - name: Patch chart integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartUiState.kt',
              "    val signals: List<ChartSignal> = emptyList(),\n"
              "    val showSignalHistory: Boolean = false,\n",
              "    val signals: List<ChartSignal> = emptyList(),\n"
              "    val showSignalHistory: Boolean = true,\n"
              "    val liveSignalStats: LiveSignalPerformanceStats = LiveSignalPerformanceStats(),\n",
          )

          replace_once(
              'app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartViewModel.kt',
              "    private val historicalBacktestRunner = HistoricalBacktestRunner(backtestEngine)\n",
              "    private val historicalBacktestRunner = HistoricalBacktestRunner(backtestEngine)\n"
              "    private val liveSignalArchive = LiveSignalArchive()\n"
              "    private val liveSignalPerformanceEvaluator = LiveSignalPerformanceEvaluator()\n",
          )

          old_signal_publish = (
              "        _uiState.value = mappedState.copy(\n"
              "            signals = signalComputer.computeSignals(\n"
              "                litXAnalysis = litXAnalysis.takeIf { ind.litX },\n"
              "                tradeProAnalysis = tradeProAnalysis,\n"
              "                smtDivergences = smtDivergences,\n"
              "                candles = displayCandles,\n"
              "                strategySignals = chartStrategySignals,\n"
              "                litAnalysis = litAnalysis.takeIf { ind.lit },\n"
              "                smsAnalysis = smsAnalysis.takeIf { ind.sms },\n"
              "                latestConfirmedIndex = latestConfirmedIndex,\n"
              "                fusion = signalFusion,\n"
              "            ),\n"
              "            dataFreshness = MarketDataFreshnessResolver.resolve(\n"
          )
          new_signal_publish = (
              "        val frameSignals = signalComputer.computeSignals(\n"
              "            litXAnalysis = litXAnalysis.takeIf { ind.litX },\n"
              "            tradeProAnalysis = tradeProAnalysis,\n"
              "            smtDivergences = smtDivergences,\n"
              "            candles = displayCandles,\n"
              "            strategySignals = chartStrategySignals,\n"
              "            litAnalysis = litAnalysis.takeIf { ind.lit },\n"
              "            smsAnalysis = smsAnalysis.takeIf { ind.sms },\n"
              "            latestConfirmedIndex = latestConfirmedIndex,\n"
              "            fusion = signalFusion,\n"
              "        )\n"
              "        val liveSignalContext = LiveSignalContext(\n"
              "            provider = mappedState.dataProvider,\n"
              "            symbol = symbol.trim().uppercase(),\n"
              "            timeframe = timeframe,\n"
              "            barMode = barMode,\n"
              "        )\n"
              "        val retainedSignals = liveSignalArchive.merge(\n"
              "            context = liveSignalContext,\n"
              "            frameSignals = frameSignals,\n"
              "            candles = displayCandles,\n"
              "        )\n"
              "        val liveSignalStats = liveSignalPerformanceEvaluator.evaluate(\n"
              "            signals = liveSignalArchive.liveSnapshot(liveSignalContext, displayCandles),\n"
              "            candles = displayCandles,\n"
              "            timeframe = timeframe,\n"
              "        )\n"
              "        _uiState.value = mappedState.copy(\n"
              "            signals = retainedSignals,\n"
              "            liveSignalStats = liveSignalStats,\n"
              "            dataFreshness = MarketDataFreshnessResolver.resolve(\n"
          )
          replace_once(
              'app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartViewModel.kt',
              old_signal_publish,
              new_signal_publish,
          )

          replace_once(
              'app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartViewModel.kt',
              "            aiDecision = null, confluence = null,\n"
              "            chartBacktest = ChartBacktestState(\n",
              "            aiDecision = null, confluence = null,\n"
              "            signals = emptyList(), liveSignalStats = LiveSignalPerformanceStats(),\n"
              "            chartBacktest = ChartBacktestState(\n",
          )

          replace_once(
              'app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartViewModel.kt',
              "        _uiState.value = current.copy(\n"
              "            barMode = barMode,\n"
              "            chartBacktest = ChartBacktestState(\n",
              "        _uiState.value = current.copy(\n"
              "            barMode = barMode,\n"
              "            signals = emptyList(),\n"
              "            liveSignalStats = LiveSignalPerformanceStats(),\n"
              "            chartBacktest = ChartBacktestState(\n",
          )

          replace_once(
              'app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartScreen.kt',
              "                        if (!replayState.isActive) {\n"
              "                            ChartBacktestSummaryOverlay(\n",
              "                        if (!replayState.isActive && state.showSignalHistory && state.liveSignalStats.totalObserved > 0) {\n"
              "                            com.foxtrader.app.feature.chart.presentation.components.LiveSignalPerformanceOverlay(\n"
              "                                stats = state.liveSignalStats,\n"
              "                                modifier = Modifier\n"
              "                                    .align(Alignment.TopEnd)\n"
              "                                    .padding(top = 8.dp, end = 70.dp),\n"
              "                            )\n"
              "                        }\n"
              "                        if (!replayState.isActive) {\n"
              "                            ChartBacktestSummaryOverlay(\n",
          )
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-live-signal-history-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartUiState.kt \
                  app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartViewModel.kt \
                  app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartScreen.kt \
                  .github/workflows/one-shot-live-signal-history-patch.yml
          git commit -m "Integrate retained live signal history [live-history-patched]"
          git push origin HEAD:feat/live-signal-history
