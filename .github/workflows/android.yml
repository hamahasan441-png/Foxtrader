name: Android CI — Build APK

# ============================================================================
# FOXTRADER — Android build pipeline
# Builds a real debug APK on GitHub's runners (which have the Android SDK +
# network) and uploads it as a downloadable artifact. This is the verifiable
# path to an installable APK.
# ============================================================================

on:
  push:
    # `claude/**` is included so agent branches are built on every push. Without
    # it a stacked PR — one whose base is another working branch rather than
    # `main` — matched neither trigger and shipped with no CI at all: the
    # `pull_request` trigger below only fires for PRs targeting `main`.
    branches: [ main, "feat/**", "fix/**", "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # Allow manual trigger from the Actions tab

permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one, so a branch that both pushes and
  # has an open PR to `main` gets a single run instead of two racing ones.
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # Uses the committed Gradle wrapper (gradlew + gradle-wrapper.jar).
        # Enables Gradle dependency + build caching keyed off the wrapper.

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Tests run BEFORE the APK is built and uploaded.
      #
      # Previously assembleDebug ran first and the artifact was uploaded
      # immediately, so a commit that broke the unit tests still published a
      # downloadable APK. The job went red afterwards, but by then an untested
      # build was already sitting in the artifacts list waiting to be installed.
      # Failing here means no APK is produced at all, which is the correct
      # outcome: an artifact should be evidence that the suite passed.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon --no-configuration-cache

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxtrader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
