name: Apply LiT Adventure v2 PR gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integrate/lit-adventure-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/lit-adventure-v2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply scoped LiT/LiTX replacement
        run: python3 .github/scripts/apply-lit-v2.py
      - name: Verify protected newer systems remain
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/foxtrader/data/remote/api/AllRatesTodayApi.kt
          test -f app/src/main/java/com/foxtrader/data/remote/api/AllRatesTodayDataSource.kt
          test -f app/src/main/java/com/foxtrader/domain/strategy/RsiOrderFlowSignalEngine.kt
          test -f app/src/main/java/com/foxtrader/ui/chart/ApprovedAnalysisSystem.kt
          grep -q 'AllRatesToday' app/src/main/java/com/foxtrader/data/remote/api/AllRatesTodayDataSource.kt
      - name: Build and unit test merged project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Remove archive and temporary integration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f Foxtrader-LitAdventure-v2.zip
          rm -f .github/scripts/apply-lit-v2.py
          rm -f .github/workflows/inspect-lit-adventure-v2.yml
          rm -f .github/workflows/lit-v2-diff.yml
          rm -f .github/workflows/apply-lit-v2.yml
          rm -f .github/workflows/apply-lit-v2-pr.yml
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'integrate: apply LiT Adventure v2 [skip ci]'
          git push origin HEAD:integrate/lit-adventure-v2
