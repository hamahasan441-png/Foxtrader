name: Apply LiT Adventure v2 PR gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integrate/lit-adventure-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/lit-adventure-v2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply scoped LiT Adventure v2 replacement
        run: python3 .github/scripts/apply-lit-v2.py

      - name: Enforce LiT-only source diff
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git diff --name-only)"
          if [ -z "$changes" ]; then
            echo "LiT Adventure v2 source is already identical to the archive"
            exit 0
          fi

          unexpected="$(
            printf '%s\n' "$changes" |
            grep -Ev '^(app/src/main/java/com/foxtrader/app/domain/usecase/litx/|app/src/main/java/com/foxtrader/app/feature/litx/|app/src/test/java/com/foxtrader/app/domain/usecase/litx/|app/src/test/java/com/foxtrader/app/feature/litx/)' || true
          )"

          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside LiT Adventure v2 scopes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          echo "Verified scoped LiT Adventure v2 diff:"
          printf '%s\n' "$changes"

      - name: Build APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Remove archive and temporary integration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f Foxtrader-LitAdventure-v2.zip
          rm -f .github/scripts/apply-lit-v2.py
          rm -f .github/workflows/inspect-lit-adventure-v2.yml
          rm -f .github/workflows/lit-v2-diff.yml
          rm -f .github/workflows/apply-lit-v2.yml
          rm -f .github/workflows/apply-lit-v2-pr.yml

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit'
            exit 1
          fi
          git commit -m 'integrate: apply LiT Adventure v2'
          git push origin HEAD:integrate/lit-adventure-v2
