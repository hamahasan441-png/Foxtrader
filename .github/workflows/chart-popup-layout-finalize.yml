name: Finalize chart popup leak and workspace fix

on:
  push:
    branches:
      - fix/chart-popup-leak-fullscreen-price-20260825

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-popup-leak-fullscreen-price-20260825
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply original patch and compile fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/chart-popup-layout-patch.yml').read_text()
          match = re.search(
              r"- name: Apply source patch\n\s+shell: bash\n\s+run: \|\n\s+python3 - <<'PY'\n(?P<script>.*?)\n\s+PY\n",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('Could not extract the validated source patch')
          script = textwrap.dedent(match.group('script'))
          exec(compile(script, '<chart-source-patch>', 'exec'), {})

          # PaddingValues.calculateBottomPadding() is an interface method in the
          # Compose version used by FoxTrader. It needs no top-level extension import.
          nav = Path('app/src/main/java/com/foxtrader/app/ui/navigation/FoxNavHost.kt')
          nav_text = nav.read_text()
          nav_text = nav_text.replace(
              'import androidx.compose.foundation.layout.calculateBottomPadding\n',
              '',
          )
          nav.write_text(nav_text)
          PY

      - name: Verify leak and layout contracts
        shell: bash
        run: |
          set -euo pipefail
          chart=app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartScreen.kt
          nav=app/src/main/java/com/foxtrader/app/ui/navigation/FoxNavHost.kt
          ! grep -q 'DropdownMenu(' "$chart"
          ! grep -q 'DropdownMenuItem(' "$chart"
          ! grep -q 'providerMenuExpanded' "$chart"
          ! grep -q 'import androidx.compose.foundation.layout.calculateBottomPadding' "$nav"
          grep -q 'ProviderPickerPanel' "$chart"
          grep -q 'statusBarsPadding' "$chart"
          grep -q 'innerPadding.calculateBottomPadding()' "$nav"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain > /tmp/chart-tests.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '=== focused Gradle failure ==='
            grep -E '(^e: |FAILURE:|Execution failed|Compilation error|Unresolved reference|Type mismatch|error:|FAILED)' /tmp/chart-tests.log | tail -n 160 || true
            echo '=== Gradle tail ==='
            tail -n 160 /tmp/chart-tests.log
            exit "$rc"
          fi
          tail -n 40 /tmp/chart-tests.log

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace --console=plain > /tmp/chart-build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '=== focused APK build failure ==='
            grep -E '(^e: |FAILURE:|Execution failed|Compilation error|Unresolved reference|Type mismatch|error:|FAILED)' /tmp/chart-build.log | tail -n 160 || true
            echo '=== Gradle tail ==='
            tail -n 160 /tmp/chart-build.log
            exit "$rc"
          fi
          tail -n 40 /tmp/chart-build.log

      - name: Commit only tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/chart-popup-layout-patch.yml
          rm -f .github/workflows/chart-popup-layout-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foxtrader/app/feature/chart/presentation/ChartScreen.kt \
                  app/src/main/java/com/foxtrader/app/ui/navigation/FoxNavHost.kt \
                  .github/workflows/chart-popup-layout-patch.yml \
                  .github/workflows/chart-popup-layout-finalize.yml
          git commit -m 'fix(chart): eliminate popup leak and expand price workspace'
          git push origin HEAD:fix/chart-popup-leak-fullscreen-price-20260825
