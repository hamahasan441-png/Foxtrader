name: Apply LiT Adventure v2 scoped replacement

on:
  push:
    branches: [integrate/lit-adventure-v2]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'integrate: apply LiT Adventure v2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/lit-adventure-v2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Safely extract and replace LiT/LiTX packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          archive = repo / 'Foxtrader-LitAdventure-v2.zip'
          if not archive.is_file():
              raise SystemExit('Archive missing; nothing to apply')
          out = Path(os.environ['RUNNER_TEMP']) / 'litv2-apply'
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0o170000
                  if p.is_absolute() or '..' in p.parts or mode == stat.S_IFLNK:
                      raise SystemExit(f'Unsafe archive member: {info.filename}')
              z.extractall(out)

          roots = [p.parent for p in out.rglob('settings.gradle.kts') if (p.parent / 'app').is_dir()]
          if not roots:
              raise SystemExit('No Android project root in archive')
          roots.sort(key=lambda p: (len(p.relative_to(out).parts), str(p)))
          srcroot = roots[0]

          scopes = [
              Path('app/src/main/java/com/foxtrader/domain/trading/lit'),
              Path('app/src/main/java/com/foxtrader/domain/trading/litx'),
              Path('app/src/main/java/com/foxtrader/domain/model/litx'),
              Path('app/src/main/java/com/foxtrader/data/local/litx'),
              Path('app/src/main/java/com/foxtrader/data/repository/litx'),
              Path('app/src/test/java/com/foxtrader/domain/trading/lit'),
              Path('app/src/test/java/com/foxtrader/domain/trading/litx'),
              Path('app/src/test/java/com/foxtrader/domain/model/litx'),
              Path('app/src/test/java/com/foxtrader/data/local/litx'),
              Path('app/src/test/java/com/foxtrader/data/repository/litx'),
          ]

          touched = 0
          for rel in scopes:
              src = srcroot / rel
              dst = repo / rel
              if src.exists():
                  if dst.exists():
                      shutil.rmtree(dst)
                  shutil.copytree(src, dst)
                  count = sum(1 for p in src.rglob('*') if p.is_file())
                  touched += count
                  print(f'REPLACED {rel} ({count} files)')
              elif dst.exists():
                  shutil.rmtree(dst)
                  print(f'DELETED stale scope {rel}')

          if touched == 0:
              raise SystemExit('No LiT/LiTX files found in archive; refusing empty replacement')
          print(f'Total archive LiT/LiTX files copied: {touched}')
          PY

      - name: Verify no protected provider regression
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/foxtrader/data/remote/api/AllRatesTodayApi.kt
          test -f app/src/main/java/com/foxtrader/data/remote/api/AllRatesTodayDataSource.kt
          test -f app/src/main/java/com/foxtrader/domain/strategy/RsiOrderFlowSignalEngine.kt
          test -f app/src/main/java/com/foxtrader/ui/chart/ApprovedAnalysisSystem.kt
          grep -q 'AllRatesToday' app/src/main/java/com/foxtrader/data/remote/api/AllRatesTodayDataSource.kt

      - name: Build and unit test merged current project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Remove archive and temporary integration workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f Foxtrader-LitAdventure-v2.zip
          rm -f .github/workflows/inspect-lit-adventure-v2.yml
          rm -f .github/workflows/lit-v2-diff.yml
          rm -f .github/workflows/apply-lit-v2.yml

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'integrate: apply LiT Adventure v2 [skip ci]'
          git push origin HEAD:integrate/lit-adventure-v2
