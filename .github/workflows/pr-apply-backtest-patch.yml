name: Apply Backtest Visual + RSI OF patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/backtest-lab-visual-rsi-of' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backtest-lab-visual-rsi-of
          fetch-depth: 0
      - name: Execute embedded one-shot patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/patch-backtest-visual-rsi-of.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git config user.name"
          body = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'embedded_patch.py', 'exec'))
          Path('.github/workflows/pr-apply-backtest-patch.yml').unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add candle-by-candle Backtest Lab and expose RSI OrderFlow"
          git push origin HEAD:feat/backtest-lab-visual-rsi-of
