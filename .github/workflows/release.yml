name: Android Release — AAB + APK

# ============================================================================
# FOXTRADER — Release pipeline
# Builds a signed Android App Bundle (.aab) and APK for the Play Store.
#
# Runs ONLY on version tags (v*) or manual dispatch — never on PRs — so the
# fast PR feedback loop (the debug build in android.yml) stays green and is not
# gated on an R8/release build that requires signing secrets.
#
# Signing: supply these as repository Actions secrets. When absent, the release
# build falls back to debug signing (see app/build.gradle.kts) and still
# produces an installable-but-not-uploadable artifact for verification.
#   FOXTRADER_KEYSTORE_BASE64   — base64 of the release keystore
#   FOXTRADER_KEYSTORE_PASSWORD — keystore password
#   FOXTRADER_KEY_ALIAS         — key alias
#   FOXTRADER_KEY_PASSWORD      — key password
# ============================================================================

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FOXTRADER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/foxtrader-release.jks"
            echo "path=$RUNNER_TEMP/foxtrader-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret present — release build will fall back to debug signing."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version code
        id: version
        run: echo "code=$(( GITHUB_RUN_NUMBER + 1000 ))" >> "$GITHUB_OUTPUT"

      - name: Build release AAB + APK
        env:
          FOXTRADER_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          FOXTRADER_KEYSTORE_PASSWORD: ${{ secrets.FOXTRADER_KEYSTORE_PASSWORD }}
          FOXTRADER_KEY_ALIAS: ${{ secrets.FOXTRADER_KEY_ALIAS }}
          FOXTRADER_KEY_PASSWORD: ${{ secrets.FOXTRADER_KEY_PASSWORD }}
          FOXTRADER_VERSION_CODE: ${{ steps.version.outputs.code }}
          FOXTRADER_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxtrader-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxtrader-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90
