name: Apply chart workspace camera fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integrate/lit-adventure-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/lit-adventure-v2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply bounded future-space camera patch
        run: python3 .github/scripts/apply-chart-workspace.py

      - name: Verify scoped source changes
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git diff --name-only)"
          printf '%s\n' "$changes"
          unexpected="$(printf '%s\n' "$changes" | grep -Ev '^(app/src/main/java/com/foxtrader/app/feature/chart/presentation/components/ChartViewport.kt|app/src/test/java/com/foxtrader/app/feature/chart/presentation/components/ChartViewportTest.kt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected patch output:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test -n "$changes"

      - name: Build APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Commit verified viewport patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foxtrader/app/feature/chart/presentation/components/ChartViewport.kt
          git add app/src/test/java/com/foxtrader/app/feature/chart/presentation/components/ChartViewportTest.kt
          git commit -m 'ui: allow bounded right-side chart space'
          git push origin HEAD:integrate/lit-adventure-v2
